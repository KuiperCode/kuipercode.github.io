<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer orbital ring -->
  <circle cx="60" cy="60" r="55" stroke="url(#gradient1)" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Middle orbital ring -->
  <circle cx="60" cy="60" r="45" stroke="url(#gradient1)" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Inner circle background -->
  <circle cx="60" cy="60" r="38" fill="url(#gradient2)" opacity="0.15"/>

  <!-- Cloud icon simplified - top layer -->
  <path d="M45 52C45 48.134 48.134 45 52 45C54.213 45 56.213 46.012 57.528 47.618C58.59 46.621 60.013 46 61.5 46C64.538 46 67 48.462 67 51.5C67 51.668 66.991 51.834 66.975 52H68C71.314 52 74 54.686 74 58C74 61.314 71.314 64 68 64H48C44.686 64 42 61.314 42 58C42 54.982 44.244 52.445 47.17 52.075C45.826 52.654 45 53.743 45 52Z" fill="url(#gradient1)" opacity="0.9"/>

  <!-- Network nodes -->
  <circle cx="60" cy="25" r="3" fill="#00d4ff"/>
  <circle cx="85" cy="45" r="3" fill="#0066cc"/>
  <circle cx="85" cy="75" r="3" fill="#00d4ff"/>
  <circle cx="35" cy="75" r="3" fill="#0066cc"/>
  <circle cx="35" cy="45" r="3" fill="#00d4ff"/>

  <!-- Connection lines -->
  <line x1="60" y1="28" x2="82" y2="45" stroke="url(#gradient1)" stroke-width="1" opacity="0.4"/>
  <line x1="82" y1="48" x2="82" y2="72" stroke="url(#gradient1)" stroke-width="1" opacity="0.4"/>
  <line x1="82" y1="75" x2="38" y2="75" stroke="url(#gradient1)" stroke-width="1" opacity="0.4"/>
  <line x1="35" y1="72" x2="35" y2="48" stroke="url(#gradient1)" stroke-width="1" opacity="0.4"/>
  <line x1="38" y1="45" x2="57" y2="28" stroke="url(#gradient1)" stroke-width="1" opacity="0.4"/>

  <!-- Center glow -->
  <circle cx="60" cy="60" r="10" fill="url(#gradient3)" opacity="0.3"/>

  <!-- Letter K stylized -->
  <path d="M54 72L54 80M54 76L59 72M54 76L59 80" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letter C stylized -->
  <path d="M68 72C66 72 64 73 64 76C64 79 66 80 68 80" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <defs>
    <!-- Blue to Cyan gradient -->
    <linearGradient id="gradient1" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Radial gradient for background -->
    <radialGradient id="gradient2" cx="60" cy="60" r="38">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="gradient3" cx="60" cy="60" r="10">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066cc" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
